<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>حاضر المعلم</title>
<style>
:root{--p:#0f766e;--bg:#f5f8f7;--card:#fff;--tx:#14211f;--mut:#5b6b68;--bd:#e2e8e6;--g:#15803d;--a:#b45309;--r:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0d1514;--card:#13201e;--tx:#e8f0ee;--mut:#9fb2ae;--bd:#22312e;--g:#4ade80;--a:#fbbf24;--r:#f87171}}
*{box-sizing:border-box}body{margin:0;width:400px;background:var(--bg);color:var(--tx);font:14px/1.6 "Segoe UI",Tahoma,Arial,sans-serif}
header{background:var(--p);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}header b{font-size:16px;flex:1}
main{padding:10px 12px 14px;max-height:540px;overflow:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut);font-size:12.5px}
.btn{font:inherit;border:0;border-radius:10px;padding:8px 12px;font-weight:600;background:#0f766e14;color:var(--tx);cursor:pointer}
.btn.p{background:var(--p);color:#fff}.btn.s{padding:4px 9px;font-size:12.5px}
.tag{border-radius:20px;padding:0 8px;font-size:12px;background:#0f766e14}
.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}
.day{font-weight:700;margin:4px 0 6px}
.m{border-top:1px solid var(--bd);padding:7px 0}.m:first-of-type{border:0}
.m.off{opacity:.5}
input[type=text]{font:inherit;width:100%;padding:5px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);direction:ltr;font-size:12px}
.sw{position:relative;width:42px;height:24px;flex-shrink:0}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cbd5d2;border-radius:24px;cursor:pointer;transition:.2s}.sw span:before{content:"";position:absolute;width:18px;height:18px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:#22c55e}.sw input:checked+span:before{transform:translateX(-18px)}
footer{text-align:center;color:var(--mut);font-size:11.5px;padding:0 0 10px}
</style></head><body>
<header><b>🎓 حاضر المعلم</b><label class="sw" title="تشغيل آلي"><input type="checkbox" id="auto"><span></span></label><span id="autoTxt" style="font-size:12.5px"></span></header>
<main id="main"></main>
<footer id="foot"></footer>
<script src="popup.js"></script>
</body></html>
