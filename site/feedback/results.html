<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>نتائج الاستبيان</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0f766e;--p2:#14b8a6;--bg:#f5f8f7;--card:#fff;--tx:#14211f;--mut:#5b6b68;--bd:#e2e8e6}
@media (prefers-color-scheme:dark){:root{--bg:#0d1514;--card:#13201e;--tx:#e8f0ee;--mut:#9fb2ae;--bd:#22312e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.8 "IBM Plex Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:920px;margin:auto;padding:0 16px}
header{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;padding:36px 0 44px}
header a{color:#fff;opacity:.85;text-decoration:none;font-size:14px}
h1{font-size:clamp(26px,5vw,36px);margin:6px 0 4px}header p{margin:0;opacity:.9}
nav.toc{display:flex;flex-wrap:wrap;gap:8px;margin:-22px 0 20px}
nav.toc a{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;color:var(--tx);text-decoration:none;font-size:14px}
section{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;scroll-margin-top:12px}
.step{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
@media (max-width:720px){.step{grid-template-columns:1fr}}
.n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;font-weight:700;margin-inline-end:8px}
h2{font-size:20px;margin:0 0 10px;display:flex;align-items:center}
ol,ul{margin:0;padding-inline-start:22px}li{margin:4px 0}
img{width:100%;border-radius:12px;border:1px solid var(--bd);box-shadow:0 4px 16px #0001;background:#fff}
code{background:#0f766e18;padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
.tip{background:#0f766e12;border-inline-start:4px solid var(--p2);padding:8px 12px;border-radius:8px;margin-top:12px;font-size:15px}
.btn{display:inline-block;background:var(--p);color:#fff;font-weight:700;padding:10px 20px;border-radius:12px;text-decoration:none}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px 0 40px}
</style>
<style>details{border-bottom:1px solid var(--bd);padding:10px 0}details:last-child{border:0}summary{cursor:pointer;font-weight:600}
label{display:block;margin:12px 0 4px;font-weight:600}input,textarea,select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
textarea{min-height:80px}.stars{display:flex;gap:6px;flex-direction:row-reverse;justify-content:flex-end}.stars button{font-size:28px;background:none;border:0;cursor:pointer;color:#cbd5d1;padding:0}.stars button.on{color:#f59e0b}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{display:flex;gap:6px;align-items:center;font-weight:normal;margin:0;border:1px solid var(--bd);border-radius:999px;padding:4px 12px}.chk input{width:auto}
button.btn{border:0;cursor:pointer;font:inherit;margin-top:14px}</style></head><body>
<header><div class="wrap"><a href="/">← حاضر المعلم</a><h1>📊 نتائج الاستبيان</h1><p>ردود المعلمين.</p></div></header>
<main class="wrap" style="margin-top:16px"><section id="out">جارٍ التحميل…</section>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k=new URLSearchParams(location.search).get('k')||'';
fetch('/api/feedback?k='+encodeURIComponent(k)).then(r=>r.json()).then(d=>{const o=document.getElementById('out');
if(!d.ok){o.textContent='الرابط غير صحيح';return}
const it=d.items;if(!it.length){o.textContent='لا ردود بعد';return}
const avg=(it.reduce((a,x)=>a+x.rating,0)/it.length).toFixed(1);const used={};it.forEach(x=>x.used.forEach(u=>used[u]=(used[u]||0)+1));
o.innerHTML=`<p><b>${it.length}</b> رد · متوسط التقييم <b>${avg}</b> ★</p><p>${Object.entries(used).sort((a,b)=>b[1]-a[1]).map(([u,n])=>esc(u)+' ('+n+')').join(' · ')}</p>`+
it.map(x=>`<div style="border-top:1px solid var(--bd);padding:10px 0"><b>${'★'.repeat(x.rating)}</b> <span style="color:var(--mut)">${new Date(x.at).toLocaleString('ar-SA')} ${esc(x.school)} ${esc(x.name)}</span>
${x.good?'<div>👍 '+esc(x.good)+'</div>':''}${x.bad?'<div>⚠️ '+esc(x.bad)+'</div>':''}${x.idea?'<div>💡 '+esc(x.idea)+'</div>':''}</div>`).join('')}).catch(()=>{document.getElementById('out').textContent='تعذّر التحميل'});
</script></main>
<footer>إعداد وتطوير: عبدالمجيد السيد · 0561955430</footer></body></html>
