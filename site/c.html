<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>تحكم الحصة — حاضر المعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0f766e;--bg:#f5f8f7;--card:#fff;--tx:#14211f;--mut:#5b6b68;--bd:#e2e8e6;--grn:#15803d;--amb:#b45309;--red:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0d1514;--card:#13201e;--tx:#e8f0ee;--mut:#9fb2ae;--bd:#22312e;--grn:#4ade80;--amb:#fbbf24;--red:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--p);color:#fff;padding:14px 16px}header b{font-size:18px}header .s{opacity:.85;font-size:13px}
.wrap{max-width:560px;margin:auto;padding:12px 16px 30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.big{font-size:20px;font-weight:700}.mut{color:var(--mut);font-size:13.5px}
.tag{display:inline-block;border-radius:20px;padding:1px 10px;font-size:13px;background:#0f766e18}
.g{color:var(--grn)}.a{color:var(--amb)}.r{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.stats div{background:#0f766e0d;border-radius:12px;padding:8px 4px}.stats b{display:block;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:14px;padding:16px 8px;font-weight:700;font-size:16px;background:#0f766e14;color:var(--tx);cursor:pointer;min-height:64px}
button.pri{background:var(--p);color:#fff}button.dan{background:#b91c1c18;color:var(--red)}
button:active{transform:scale(.97)}button:disabled{opacity:.5}
.full{grid-column:1/-1}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#14211f;color:#fff;border-radius:12px;padding:12px 14px;display:none;z-index:9}
.names{margin-top:6px;font-size:14px}
</style></head><body>
<header><b>🎓 تحكم الحصة</b><div class="s" id="sub">حاضر المعلم</div></header>
<div class="wrap">
  <div class="card" id="head"><div class="mut">جارٍ الاتصال…</div></div>
  <div id="ctl" style="display:none">
    <div class="grid">
      <button class="pri full" data-c="teacherIn" id="bIn">✋ أنا داخل</button>
      <button data-c="muteAll">🔇 كتم الجميع</button>
      <button data-c="relock">🔒 إعادة القفل</button>
      <button data-c="status">👥 الحضور الآن</button>
      <button data-c="video">🎬 افتح المقطع</button>
      <button data-c="summary">📝 ملخص الدرس</button>
      <button data-c="ask">❓ سؤال</button>
    </div>
    <div class="card" style="margin-top:12px"><input id="q" placeholder="سؤال من عندك (اختياري) ثم ❓">
      <div style="display:flex;gap:8px;margin-top:8px"><input id="nm" placeholder="اسم طالب" style="flex:1"><button data-c="allow" style="min-height:0;padding:10px 14px">🎙️ اسمح له</button></div></div>
    <button class="dan" data-c="end" style="width:100%">⏹ إنهاء الحصة</button>
    <div class="card" id="info" style="margin-top:12px;display:none"></div>
  </div>
</div>
<div id="toast"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const token = location.pathname.split('/').pop(), API = '/api/ctl/' + token;
const PH = { join: ['جارٍ الدخول', 'a'], lock: ['جارٍ القفل', 'a'], live: ['تعمل', 'g'], done: ['انتهت', ''], stopped: ['أُوقفت', 'r'] };
let st = {}, waiting = null;
const toast = (t, ms = 3500) => { const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms); };
function render() {
  const live = st.at && Date.now() - st.at < 90000 && ['join', 'lock', 'live'].includes(st.phase);
  document.getElementById('ctl').style.display = live ? '' : 'none';
  const h = document.getElementById('head');
  if (!live) { h.innerHTML = `<div class="big">لا توجد حصة جارية</div><div class="mut">تظهر الأزرار هنا تلقائيًا عند بدء حصتك على الكمبيوتر. أبقِ هذه الصفحة مفتوحة.</div>${st.cls ? `<div class="mut" style="margin-top:6px">آخر حصة: ${esc(st.cls)} · ${esc(st.start || '')}</div>` : ''}`; return; }
  const ph = PH[st.phase] || ['', ''];
  h.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><span class="big" style="flex:1">${esc(st.cls)}</span><span class="tag ${ph[1]}">${ph[0]}</span></div>
    <div class="mut">${esc(st.lesson || '')} · ${esc(st.start || '')} · ${st.left != null ? 'باقي ' + st.left + ' د' : ''}</div>
    <div style="margin-top:4px">${st.teacherSeen ? '✅ دخلتَ ' + esc(st.teacherSeen) : '<b class="a">⏳ بانتظار دخولك</b>'}</div>
    <div class="stats"><div><b class="g">${st.present ?? 0}</b>حاضر</div><div><b class="r">${st.absent ?? '–'}</b>غائب</div><div><b>${(st.hands || []).length}</b>✋ يد مرفوعة</div></div>
    ${(st.hands || []).length ? `<div class="names">✋ ${esc(st.hands.join('، '))}</div>` : ''}
    ${(st.chat || []).length ? `<div class="names mut">💬 ${st.chat.map(c => '<b>' + esc(c.who) + ':</b> ' + esc(c.txt)).join('<br>💬 ')}</div>` : ''}`;
  document.getElementById('bIn').style.display = st.teacherSeen ? 'none' : '';
  const a = st.ack; if (waiting && a && a.id === waiting.id) { const w = waiting; waiting = null; document.querySelectorAll('button').forEach(b => b.disabled = false); showAck(w.c, a); }
}
function showAck(c, a) {
  if (!a.ok) return toast('⚠️ ' + (a.err || 'تعذّر التنفيذ'));
  if (c === 'status') { const i = document.getElementById('info'); i.style.display = '';
    i.innerHTML = `<b>👥 الحاضرون (${(a.people || []).length})</b><div class="names">${esc((a.people || []).join('، ')) || '—'}</div>${(a.absent || []).length ? `<b class="r" style="display:block;margin-top:8px">الغائبون (${a.absent.length})</b><div class="names">${esc(a.absent.join('، '))}</div>` : ''}`; return toast('✓ تم'); }
  toast({ ask: '✓ نُشر السؤال: ' + (a.text || ''), summary: '✓ نُشر ملخص الدرس', end: '✓ أُنهيت الحصة', video: '✓ فُتح المقطع على الكمبيوتر — اضغط Ctrl+Shift+1 لعرضه' }[c] || '✓ تم');
}
async function pull() { try { st = await (await fetch(API + '/state', { cache: 'no-store' })).json(); document.getElementById('sub').textContent = st.teacher ? 'الأستاذ/ ' + st.teacher : 'حاضر المعلم'; render(); } catch (e) {} }
document.querySelectorAll('[data-c]').forEach(b => b.onclick = async () => {
  const c = b.dataset.c;
  if (c === 'end' && !confirm('إنهاء الحصة للجميع؟')) return;
  if (c === 'allow' && !document.getElementById('nm').value.trim()) return toast('اكتب اسم الطالب');
  const body = { c, text: c === 'ask' ? document.getElementById('q').value.trim() : '', name: c === 'allow' ? document.getElementById('nm').value.trim() : '' };
  document.querySelectorAll('button').forEach(x => x.disabled = true); toast('⏳ يُرسل للكمبيوتر…', 15000);
  try { const r = await (await fetch(API + '/cmd', { method: 'POST', body: JSON.stringify(body) })).json(); if (!r.ok) throw 0; waiting = { id: r.id, c };
    if (c === 'ask') document.getElementById('q').value = '';
    setTimeout(() => { if (waiting && waiting.id === r.id) { waiting = null; document.querySelectorAll('button').forEach(x => x.disabled = false); toast('⚠️ لم يصل رد من الكمبيوتر. تأكد أن Chrome مفتوح.'); } }, 20000);
  } catch (e) { document.querySelectorAll('button').forEach(x => x.disabled = false); toast('⚠️ تعذّر الإرسال'); }
});
pull(); setInterval(pull, 2500);
</script></body></html>
